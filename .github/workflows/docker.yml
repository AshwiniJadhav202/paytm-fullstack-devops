name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ashwinijadhav202/paytm-backend:latest

      - name: Build and push User App
        uses: docker/build-push-action@v6
        with:
          context: ./paytm-turbo
          file: ./paytm-turbo/Dockerfile.user
          push: true
          tags: ashwinijadhav202/paytm-user-app:latest

      - name: Build and push Merchant App
        uses: docker/build-push-action@v6
        with:
          context: ./paytm-turbo
          file: ./paytm-turbo/Dockerfile.merchant
          push: true
          tags: ashwinijadhav202/paytm-merchant-app:latest